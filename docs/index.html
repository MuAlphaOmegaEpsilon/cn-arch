<script type="text/javascript">
function page_visit()
{
 let pathname = window.location.pathname;
 if (pathname === "/")
  return "homepage";
 if (pathname.endsWith("/"))
  pathname = pathname.substring(0, pathname.length - 1);
 const pathname_array = pathname.split("/");
 return pathname_array[pathname_array.length - 1];
}

function isbot()
{
 return navigator.webdriver || [
    "googlebot",
    "bingbot",
    "yandexbot",
    "duckduckbot",
    "slurp", // Yahoo
    "baiduspider",
    "ia_archiver", // Alexa
    "facebookexternalhit",
    "twitterbot",
    "rogerbot", // Moz
    "linkedinbot",
    "embedly",
    "quora link preview",
    "showyoubot",
    "outbrain",
    "pinterest/0.",
    "developers.google.com/+/web/snippet"
  ].some(bot => navigator.userAgent.toLowerCase().includes(bot));
}

function ntfy(title)
{
 if (window.location.protocol == "file:" || window.location.host.startsWith("192.168."))
  return Promise.resolve();
 if (isbot())
  title = "🤖 " + title;
 return fetch("https://ntfy.sh/cnarchstudio",
              { method: "POST",
                headers: { "Title": title },
                body: "UserAgent: " + navigator.userAgent + "\n" +
                      "Platform:  " + navigator.platform  + "\n" +
                      "Languages: " + navigator.language  + "\n" +
                      "Display:   " + screen.width + "x" + screen.height + "\n" +
                      "Hardware:  " + navigator.hardwareConcurrency + " threads, " + (navigator.deviceMemory ?? "--") + "GB\n"
              }
             ).catch((error) => {});
}
ntfy(page_visit());

</script>
